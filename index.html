<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルな家計簿アプリ</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <h1>家計簿</h1>
    <h2>家計簿をつけましょうか</h2>
  </header>

  <main class="dashboard-layout">
    <section class="panel entry-panel" aria-labelledby="entry-heading">
      <h2 id="entry-heading">データを登録する</h2>

      <form action="#" method="post">
        <div>
          <label for="entry-date">日付</label>
          <input type="date" id="entry-date" name="date" required>
        </div>

        <div>
          <label for="entry-item">品目</label>
          <input type="text" id="entry-item" name="item" placeholder="例：食料品" required>
        </div>

        <fieldset>
          <legend>区分</legend>
          <label>
            <input type="radio" name="type" value="expense" checked>
            支出
          </label>
          <label>
            <input type="radio" name="type" value="income">
            収入
          </label>
        </fieldset>

        <div>
          <label for="entry-amount">金額</label>
          <div class="amount-control">
            <input type="number" id="entry-amount" name="amount" min="0" step="1" placeholder="例：1000" required>
            <span>円</span>
          </div>
        </div>

        <button type="submit">追加</button>
      </form>
    </section>

    <section class="panel summary-panel" aria-labelledby="summary-heading">
      <h2 id="summary-heading">収支合計</h2>
      <p><strong id="summary-total">0円</strong></p>
    </section>

    <section class="panel list-panel" aria-labelledby="list-heading">
      <h2 id="list-heading">登録データ一覧</h2>

      <div class="table-scroll">
        <table>
          <caption>登録した家計簿データ</caption>
          <thead>
            <tr>
              <th scope="col">日付</th>
              <th scope="col">品目</th>
              <th scope="col">区分</th>
              <th scope="col">金額</th>
            </tr>
          </thead>
          <tbody id="entry-list">
            <tr>
              <td colspan="4">登録されたデータはありません。</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
